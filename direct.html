<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sharova Life OS — Direct Purchase</title><meta name="sharova-route-version" content="2026-09-15-direct-fix-v5"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f7f2eb;color:#211d1a;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(460px,100%);background:#fffdf9;border:1px solid #d9cec2;border-radius:24px;padding:30px;box-shadow:0 18px 60px rgba(33,29,26,.12)}.brand{font-size:12px;letter-spacing:.18em;font-weight:800}.eyebrow{font-size:11px;letter-spacing:.16em;color:#756d66;font-weight:800;margin:22px 0 8px}.price{font-size:42px;font-weight:900;margin:10px 0}.sub{color:#756d66;line-height:1.55}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#eee5da;padding:5px;border-radius:12px;margin:22px 0 16px}.tabs button{border:0;background:transparent;padding:10px;border-radius:9px;font-weight:800}.tabs .active{background:#fffdf9}.form{display:grid;gap:12px}.form label{font-size:12px;font-weight:800}.form input{width:100%;padding:13px;border:1px solid #d9cec2;border-radius:10px;background:#fff;font:inherit}.primary{border:0;border-radius:10px;padding:14px;background:#211d1a;color:white;font-weight:800;cursor:pointer}.primary:disabled{opacity:.55}.msg{min-height:20px;font-size:13px;color:#756d66}.error{color:#a33}.ok{color:#276b42}.hide{display:none}.note{padding:12px 14px;border-radius:12px;background:#eee5da;color:#756d66;font-size:12px;line-height:1.5;margin:16px 0}.back{display:block;text-align:center;margin-top:16px;color:#756d66;font-size:12px}</style></head>
<body><div class="card"><div class="brand">SHAROVA LIFE OS</div><p class="eyebrow">DIRECT PURCHASE</p><h1>Get your Life OS.</h1><p class="sub">Create your private Sharova account, then complete the one-time purchase. This is the direct-buyer checkout page.</p><div class="price">$47 <small style="font-size:13px">one time</small></div><div class="note"><strong>No subscription.</strong> Direct customers pay once for access to the Sharova Life OS workspace.</div><div class="tabs"><button id="loginTab" class="active">Log in</button><button id="signupTab">Create account</button></div><form id="form" class="form"><div id="nameWrap" class="hide"><label>Name</label><input id="name" autocomplete="name" placeholder="Your name"></div><div><label>Email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div><label>Password</label><input id="password" type="password" minlength="8" required placeholder="At least 8 characters"></div><div id="confirmWrap" class="hide"><label>Confirm password</label><input id="confirm" type="password" minlength="8" placeholder="Repeat your password"></div><div id="msg" class="msg"></div><button id="submit" class="primary" type="submit" disabled>Loading account service…</button></form><a class="back" href="/website/">← Back to Sharova Life OS</a></div>
<script>
const PROD=location.origin;
const FALLBACK_CONFIG={supabaseUrl:'https://ofodxwpukrgegtavahfm.supabase.co',supabaseAnonKey:'sb_publishable_RvJAQ8p31BacTxANx3gltw_KRxlpoxe'};
let client=null,signup=false,initError=null;
const $=id=>document.getElementById(id);
const msg=(t,c='')=>{$('msg').textContent=t;$('msg').className='msg '+c};
function mode(v){signup=v;$('loginTab').classList.toggle('active',!v);$('signupTab').classList.toggle('active',v);$('nameWrap').classList.toggle('hide',!v);$('confirmWrap').classList.toggle('hide',!v);$('submit').textContent=v?'Create account & continue':'Log in & continue';msg('')}
$('loginTab').onclick=()=>mode(false);$('signupTab').onclick=()=>mode(true);
async function checkout(){await ready;if(!client)throw Error(initError||'Account service is temporarily unavailable.');msg('Opening secure checkout…');try{const {data:{session}}=await client.auth.getSession();if(!session?.access_token)throw Error('Please log in again.');const r=await fetch('/api/create-checkout',{method:'POST',headers:{Authorization:'Bearer '+session.access_token}});const d=await r.json().catch(()=>({}));if(!r.ok||!d.url)throw Error(d.error||'Unable to start checkout.');location.href=d.url}catch(e){msg(e.message||'Unable to start checkout.','error')}}
async function continueAfterAuth(user){await ready;if(!client)throw Error(initError||'Account service is temporarily unavailable.');if(!user?.email_confirmed_at){msg('Please confirm your email first, then return here and log in.','error');return}const {data,error}=await client.from('user_entitlements').select('status,expires_at').eq('user_id',user.id).maybeSingle();if(error){msg('We could not verify your account. Please try again.','error');return}if(data?.status==='active'&&(!data.expires_at||new Date(data.expires_at)>new Date())){location.href=PROD+'/';return}await checkout()}
async function init(){try{let cfg={...FALLBACK_CONFIG};try{const r=await fetch('/api/config',{cache:'no-store'});if(r.ok){const live=await r.json();cfg={...cfg,...live}}}catch(_){}if(!cfg.supabaseUrl||!cfg.supabaseAnonKey)throw Error('Account service is temporarily unavailable.');if(!window.supabase){await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=ok;s.onerror=()=>no(Error('Account service is temporarily unavailable.'));document.head.appendChild(s)})}if(!window.supabase?.createClient)throw Error('Account service is temporarily unavailable.');client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{detectSessionInUrl:true,flowType:'pkce'}});$('submit').disabled=false;$('submit').textContent='Log in & continue';const {data}=await client.auth.getSession();if(data.session)await continueAfterAuth(data.session.user)}catch(e){initError=e.message||'Account service is temporarily unavailable.';msg(initError,'error');$('submit').disabled=true;$('submit').textContent='Account service unavailable'}}
const ready=init();
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;try{await ready;if(!client)throw Error(initError||'Account service is temporarily unavailable.');const email=$('email').value.trim(),password=$('password').value;if(signup){if(password!==$('confirm').value)throw Error('Passwords do not match.');const {data,error}=await client.auth.signUp({email,password,options:{data:{display_name:$('name').value.trim()},emailRedirectTo:PROD+'/direct/'}});if(error)throw error;if(data.session)await continueAfterAuth(data.user);else msg('Account created. Check your email, confirm it, then return here and log in.','ok')}else{const {data,error}=await client.auth.signInWithPassword({email,password});if(error)throw error;await continueAfterAuth(data.user)}}catch(e){msg(e.message||'We could not complete that request.','error')}finally{$('submit').disabled=!client}};
</script></body></html>
