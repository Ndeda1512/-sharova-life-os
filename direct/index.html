<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sharova Life OS — Direct Purchase</title><meta name="sharova-route-version" content="2026-09-15-direct-fix-v7"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f7f2eb;color:#211d1a;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(460px,100%);background:#fffdf9;border:1px solid #d9cec2;border-radius:24px;padding:30px;box-shadow:0 18px 60px rgba(33,29,26,.12)}.brand{font-size:12px;letter-spacing:.18em;font-weight:800}.eyebrow{font-size:11px;letter-spacing:.16em;color:#756d66;font-weight:800;margin:22px 0 8px}.price{font-size:42px;font-weight:900;margin:10px 0}.sub{color:#756d66;line-height:1.55}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#eee5da;padding:5px;border-radius:12px;margin:22px 0 16px}.tabs button{border:0;background:transparent;padding:10px;border-radius:9px;font-weight:800}.tabs .active{background:#fffdf9}.form{display:grid;gap:12px}.form label{font-size:12px;font-weight:800}.form input{width:100%;padding:13px;border:1px solid #d9cec2;border-radius:10px;background:#fff;font:inherit}.primary{border:0;border-radius:10px;padding:14px;background:#211d1a;color:white;font-weight:800;cursor:pointer}.primary:disabled{opacity:.55}.msg{min-height:20px;font-size:13px;color:#756d66}.error{color:#a33}.ok{color:#276b42}.hide{display:none}.note{padding:12px 14px;border-radius:12px;background:#eee5da;color:#756d66;font-size:12px;line-height:1.5;margin:16px 0}.back{display:block;text-align:center;margin-top:16px;color:#756d66;font-size:12px}</style></head>
<body><div class="card"><div class="brand">SHAROVA LIFE OS</div><p class="eyebrow">DIRECT PURCHASE</p><h1>Get your Life OS.</h1><p class="sub">Create your private Sharova account, then complete the one-time purchase. This is the direct-buyer checkout page.</p><div class="price">$47 <small style="font-size:13px">one time</small></div><div class="note"><strong>No subscription.</strong> Direct customers pay once for access to the Sharova Life OS workspace.</div><div class="tabs"><button id="loginTab" class="active">Log in</button><button id="signupTab">Create account</button></div><form id="form" class="form"><div id="nameWrap" class="hide"><label>Name</label><input id="name" autocomplete="name" placeholder="Your name"></div><div><label>Email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div><label>Password</label><input id="password" type="password" minlength="8" required placeholder="At least 8 characters"></div><div id="confirmWrap" class="hide"><label>Confirm password</label><input id="confirm" type="password" minlength="8" placeholder="Repeat your password"></div><div id="msg" class="msg"></div><button id="submit" class="primary" type="submit" disabled>Loading account service…</button></form><a class="back" href="/website/">← Back to Sharova Life OS</a></div>
<script>
const PROD=location.origin;
const SB_URL='https://ofodxwpukrgegtavahfm.supabase.co';
const SB_KEY='sb_publishable_RvJAQ8p31BacTxANx3gltw_KRxlpoxe';
let signup=false,session=null,initError=null;
const $=id=>document.getElementById(id);
const msg=(t,c='')=>{$('msg').textContent=t;$('msg').className='msg '+c};
function mode(v){signup=v;$('loginTab').classList.toggle('active',!v);$('signupTab').classList.toggle('active',v);$('nameWrap').classList.toggle('hide',!v);$('confirmWrap').classList.toggle('hide',!v);$('submit').textContent=v?'Create account & continue':'Log in & continue';msg('')}
$('loginTab').onclick=()=>mode(false);$('signupTab').onclick=()=>mode(true);
function headers(token){return {'apikey':SB_KEY,'Authorization':'Bearer '+(token||SB_KEY),'Content-Type':'application/json'}}
async function authFetch(path,body){const r=await fetch(SB_URL+'/auth/v1/'+path,{method:'POST',headers:headers(),body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.msg||d.error_description||d.message||d.error||'Account request failed.');return d}
async function restore(){const raw=localStorage.getItem('sharova_direct_session');if(!raw)return null;try{const s=JSON.parse(raw);if(s?.access_token)return s}catch(_){}localStorage.removeItem('sharova_direct_session');return null}
async function checkEntitlement(user){if(!session?.access_token||!user?.id)return false;const r=await fetch(SB_URL+'/rest/v1/user_entitlements?select=status,expires_at&user_id=eq.'+encodeURIComponent(user.id)+'&limit=1',{headers:headers(session.access_token)});if(!r.ok)return false;const rows=await r.json().catch(()=>[]);const d=rows[0];return d?.status==='active'&&(!d.expires_at||new Date(d.expires_at)>new Date())}
async function checkout(){if(!session?.access_token)throw Error('Please log in again.');msg('Opening secure checkout…');const r=await fetch('/api/create-checkout',{method:'POST',headers:{Authorization:'Bearer '+session.access_token}});const d=await r.json().catch(()=>({}));if(!r.ok||!d.url)throw Error(d.error||'Unable to start checkout.');location.href=d.url}
async function continueAfterAuth(user){if(!user?.email_confirmed_at){msg('Please confirm your email first, then return here and log in.','error');return}if(await checkEntitlement(user)){location.href=PROD+'/';return}await checkout()}
async function init(){try{session=await restore();if(session?.user){if(await checkEntitlement(session.user)){location.href=PROD+'/';return}}$('submit').disabled=false;$('submit').textContent='Log in & continue'}catch(e){initError=e.message||'Account service is temporarily unavailable.';msg(initError,'error');$('submit').disabled=false;$('submit').textContent='Try again'}}
init();
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;msg('');try{const email=$('email').value.trim(),password=$('password').value;if(signup){if(password!==$('confirm').value)throw Error('Passwords do not match.');const d=await authFetch('signup',{email,password,data:{display_name:$('name').value.trim()},options:{emailRedirectTo:PROD+'/direct/'}});if(d.access_token){session={access_token:d.access_token,user:d.user};localStorage.setItem('sharova_direct_session',JSON.stringify(session));await continueAfterAuth(d.user)}else msg('Account created. Check your email, confirm it, then return here and log in.','ok')}else{const d=await authFetch('token?grant_type=password',{email,password});if(!d.access_token)throw Error('Login did not return a session.');session={access_token:d.access_token,user:d.user};localStorage.setItem('sharova_direct_session',JSON.stringify(session));await continueAfterAuth(d.user)}}catch(e){msg(e.message||'We could not complete that request.','error')}finally{$('submit').disabled=false}};
</script></body></html>
